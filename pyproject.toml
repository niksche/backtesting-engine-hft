[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hft-backtest"
version = "0.0.1"
description = "Backtesting engine for HFT strategies — replays L2 + trades, simulates limit orders, reports PnL/inventory/turnover."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
]

[project.scripts]
hft-backtest = "hft_backtest.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["hft_backtest"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80  # raised in M11

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/hft_backtest"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
