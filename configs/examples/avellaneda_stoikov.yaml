# Avellaneda-Stoikov market-maker on sample data.
#
# Quotes around the reservation price:
#   r = mid - q * gamma * sigma^2 * dt
# with optimal spread:
#   delta = gamma * sigma^2 * dt + (2/gamma) * ln(1 + gamma/k)
#
# Parameters tuned for the sample data (small-tick crypto pair, mid ~ 0.011).
# The key insight: gamma and k must be scaled to the price magnitude.
# For prices around 0.01 and absolute price changes around 1e-6,
# we need large gamma and k to produce meaningful spreads.

lob_path: ../../data/samples/lob_sample.csv
trades_path: ../../data/samples/trades_sample.csv
output_dir: ../../reports/avellaneda_stoikov

strategy:
  name: avellaneda_stoikov
  params:
    gamma: 0.001            # risk aversion
    k: 1000000.0            # initial order arrival intensity (updated online)
    size: 20.0             # quote size per side
    dt: 1.0                 # time horizon factor
    sigma_window: 10.0      # rolling window for volatility estimate
    k_window: 50.0          # rolling window of trades for dynamic k estimation
    repost_threshold: 0.0000008 # re-quote when reservation price moves > 10 ticks

partial_fills: false
